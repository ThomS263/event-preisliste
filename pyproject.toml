[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-preisliste"
version = "0.5.0"
description = "QR-Code-Preislisten für Veranstaltungen"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==23.0.0",
  "qrcode[pil]==8.2",
]

[tool.setuptools.package-data]
event_preisliste = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.setuptools]
packages = ["event_preisliste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
