<!doctype html>
<html lang="{% block html_lang %}de{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Event-Preisliste{% endblock %}</title>
  <meta name="theme-color" content="#17332c">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='extras.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block site_header %}<header>
  <a class="brand" href="{{ url_for('home') }}">
    <img src="{{ url_for('static', filename='logo.svg') }}" width="36" height="36" alt="">Event-Preisliste
  </a>
  {% if session.admin %}<a href="{{ url_for('admin') }}">Verwaltung</a>{% endif %}
</header>{% endblock %}
<main class="{% block main_class %}{% endblock %}">
  {% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
<script src="{{ url_for('static',filename='app.js') }}" defer></script>
</body>
</html>
