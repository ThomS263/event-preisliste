<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event-Preisliste Demo</title><style>:root{font-family:system-ui;color:#173c34;background:#f7f3e9}*{box-sizing:border-box}body{margin:0}.bar{background:#fff;padding:16px 6vw}.demo{background:#ffe7a8;text-align:center;padding:9px;font-weight:700}main{max-width:900px;margin:auto;padding:7vw 5vw}.hero{background:#173c34;color:white;padding:clamp(28px,7vw,70px);border-radius:30px}h1{font-size:clamp(2.2rem,8vw,5rem);margin:.2em 0}.stands{display:flex;gap:10px;overflow:auto;padding:25px 0}.stands button{font:inherit;font-weight:700;padding:14px 20px;border:0;border-radius:99px;background:white;white-space:nowrap}.stands button.on{background:#e86c3f;color:white}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 25px #0001}.item{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ddd;font-size:1.1rem}.price{font-weight:800}</style></head><body><div class="demo">Interaktive Sandbox · Beispieldaten · keine Speicherung</div><header class="bar">🏪 <b>Event-Preisliste</b></header><main><section class="hero"><small>ADVENTMARKT 2026</small><h1>Was gibt es heute?</h1><p>Wähle einen Stand und sieh dir dessen Angebot an.</p></section><div class="stands"><button class="on" data-s="p">☕ Punschstand</button><button data-s="k">🍪 Kekshütte</button><button data-s="f">🚒 Feuerwehr</button></div><section class="card"><h2 id="title"></h2><div id="items"></div></section></main><script>const d={p:['Punschstand',['Kinderpunsch|3,50 €','Orangenpunsch|4,50 €']],k:['Kekshütte',['Vanillekipferl|3,00 €','Lebkuchen|2,50 €']],f:['Feuerwehr',['Bratwurst|5,00 €','Mineralwasser|2,00 €']]};function show(k){title.textContent=d[k][0];items.innerHTML=d[k][1].map(x=>{let a=x.split('|');return `<div class="item"><span>${a[0]}</span><span class="price">${a[1]}</span></div>`}).join('')}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('.on').classList.remove('on');b.classList.add('on');show(b.dataset.s)});show('p')</script></body></html>
