services:
  event-preisliste:
    build: .
    container_name: event-preisliste
    restart: unless-stopped
    ports:
      - "${EVENT_PORT:-8080}:8080"
    environment:
      EVENT_ADMIN_PASSWORD: "${EVENT_ADMIN_PASSWORD:-change-me-now}"
      EVENT_PUBLIC_URL: "${EVENT_PUBLIC_URL:-}"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
